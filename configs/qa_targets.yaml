    ask_age: 1.0
    quantity: pH
    rel_tol: 0.02
  - id: qa_ts_porosity_opc70_fa30_7d
    family: forward_lookup
    recipe: {binders: {OPC: 70, fly_ash: 30}, w_b: 0.40}
    ages: [7.0, 28.0, 90.0]
    ask_age: 7.0
    quantity: porosity
    rel_tol: 0.02
  - id: qa_ts_ph_opc80_slag20_28d
    family: forward_lookup
    recipe: {binders: {OPC: 80, slag: 20}, w_b: 0.35}
    ages: [7.0, 28.0]
    ask_age: 28.0
    quantity: pH
    rel_tol: 0.02

