    rel_tol: 0.02

  # --- time-series lookups: multi-age grid, ask one age (mock) -------------
  - id: qa_ts_porosity_opc60_slag40_90d
    family: forward_lookup
    recipe: {binders: {OPC: 60, slag: 40}, w_b: 0.45}
    ages: [7.0, 28.0, 90.0]
    ask_age: 90.0
    quantity: porosity
    rel_tol: 0.02
  - id: qa_ts_ph_opc100_1d
    family: forward_lookup
    recipe: {binders: {OPC: 100}, w_b: 0.50}
