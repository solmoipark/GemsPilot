  - id: qa_ambiguous_missing_age
    kind: agent_qa
    family: ambiguous
    task: >-
      Report the mock-calculated porosity of a paste of OPC 100, w/b 0.50.
    grading:
      answer_kind: refusal
      keywords: [clarif, specify, " age", "which age", missing, need]
    constraints: {max_tool_calls: 3}
    allow_real: false

  - id: qa_unavailable_strength
    kind: agent_qa
    family: ambiguous
    task: >-
      Run a mock forward calculation for a paste of OPC 100, w/b 0.50 at age
      28 days and report the 28-day compressive strength in MPa.
    grading:
      answer_kind: refusal
      allow_execution: true
      keywords: [not available, does not, cannot, unavailable, unable, not produce, not computed, not a, no compressive, outside]
    constraints: {max_tool_calls: 6}
    allow_real: false

  # =========================================================================
  # user-kinetics calibration workflow — 4 items
  # =========================================================================
  - id: qa_calib_slag_plateau
    kind: agent_qa
    family: calibration
    requires: ["${GEMSPILOT_ROOT}/configs/fixtures/user_dor_synthetic.csv"]
    task: >-
      Fit the five-parameter logistic kinetics model to the user degree-of-
      reaction data at
      "${GEMSPILOT_ROOT}/configs/fixtures/user_dor_synthetic.csv" (CSV columns
      scm, age_d, dor) using calibrate_scm_kinetics. The fitted parameters are
      stored in the reaction_model_config artifact produced by the fit. Report
      the fitted long-term plateau parameter for slag in the exact form
      "D=<value>".
    grading:
      answer_kind: numeric
      target: 0.550006
      rel_tol: 0.02
      extract: D
    constraints: {max_tool_calls: 6, min_tool_calls: 2}
    expect: {tools_called_include: [calibrate_scm_kinetics]}
    allow_real: false

  - id: qa_calib_flyash_plateau
    kind: agent_qa
    family: calibration
    requires: ["${GEMSPILOT_ROOT}/configs/fixtures/user_dor_synthetic.csv"]
    task: >-
      Fit the five-parameter logistic kinetics model to the user degree-of-
      reaction data at
      "${GEMSPILOT_ROOT}/configs/fixtures/user_dor_synthetic.csv" (CSV columns
      scm, age_d, dor) using calibrate_scm_kinetics. The fitted parameters are
      stored in the reaction_model_config artifact produced by the fit. Report
      the fitted long-term plateau parameter for fly_ash in the exact form
      "D=<value>".
    grading:
      answer_kind: numeric
      target: 0.400013
      rel_tol: 0.02
      extract: D
    constraints: {max_tool_calls: 6, min_tool_calls: 2}
